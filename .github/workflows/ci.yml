name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Araç sürümleri
        shell: bash
        run: |
          python --version
          curl --version | head -1 || true
          jq --version || echo "jq yok - python3 yedegi kullanilacak"
          pwsh --version || echo "pwsh yok - PowerShell kontrolleri atlanacak"

      - name: Her betigi sahte sunucuya karsi calistir
        run: python tests/smoke_test.py -v

  # Windows PowerShell 5.1 kurumsal Windows'ta hâlâ varsayılan; pwsh 7'den
  # ayrı davranır (TLS, kodlama, System.Net.Http). Ayrı bir iş olarak koşuyoruz.
  windows-powershell-51:
    name: smoke (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: PowerShell sürümü
        shell: powershell
        run: $PSVersionTable | Format-List

      - name: Betikleri Windows PowerShell 5.1 ile çalıştır
        env:
          SMOKE_PWSH: powershell
        run: python tests/smoke_test.py -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          shellcheck --severity=error bash/llm-prompt.sh

      - name: Bash sozdizimi
        run: bash -n bash/llm-prompt.sh

      - name: Python derleme
        run: python -m compileall -q python examples tests

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path powershell -Recurse -Severity Error
          if ($findings) { $findings | Format-Table -AutoSize; exit 1 }
          Write-Host "PSScriptAnalyzer: hata yok"
